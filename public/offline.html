<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not ready for offline use</title>
    <style>
      :root {
        --color-ink: #1c2226;
        --color-ink-soft: #4a5259;
        --color-worksheet: #e4e6de;
        --color-paper: #fbfaf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--color-worksheet);
        color: var(--color-ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      header {
        background: var(--color-paper);
        border-bottom: 1px solid rgba(28, 34, 38, 0.15);
        padding: 16px 16px 12px;
      }
      header p {
        margin: 0;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--color-ink-soft);
      }
      header h1 {
        margin: 4px 0 0;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      main {
        flex: 1;
        padding: 32px 16px;
      }
      main h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      main p {
        margin: 8px 0 0;
        max-width: 24rem;
        font-size: 14px;
        line-height: 1.6;
        color: var(--color-ink-soft);
      }
      nav {
        background: var(--color-paper);
        border-top: 1px solid rgba(28, 34, 38, 0.15);
      }
      button {
        display: block;
        width: 100%;
        min-height: 44px;
        border: 0;
        background: var(--color-ink);
        color: var(--color-paper);
        font: inherit;
        font-size: 16px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <header>
      <p>Field</p>
      <h1>Today&rsquo;s prop</h1>
    </header>
    <main>
      <h2>Not ready for offline use.</h2>
      <p>
        Open the app once with signal to prepare it for offline use. After that, today&rsquo;s prop
        stays on this phone even with no connection.
      </p>
    </main>
    <nav>
      <button type="button" onclick="location.reload()">Try again</button>
    </nav>
  </body>
</html>
